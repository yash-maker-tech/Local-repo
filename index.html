<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#101016">
	<title>Yash Shinde</title>
	<style>
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			overflow: hidden;
			color: #f7f3ed;
			background: radial-gradient(ellipse at 18% 20%, #5b3b6d55, transparent 38%), radial-gradient(ellipse at 85% 78%, #b66b3c33, transparent 34%), #101016;
			font-family: "Segoe UI", Arial, sans-serif;
		}
		main {
			position: relative;
			width: min(900px, calc(100% - 40px));
			min-height: 440px;
			display: grid;
			place-items: center;
			padding: 48px 24px;
			text-align: center;
			border: 1px solid #ffffff20;
			border-radius: 28px;
			background: linear-gradient(135deg, #ffffff0b, #ffffff03);
			box-shadow: 0 30px 100px #0008, inset 0 1px #ffffff18;
			backdrop-filter: blur(12px);
			animation: rise 1s ease-out both;
		}
		main::before, main::after {
			content: "";
			position: absolute;
			width: 110px;
			height: 110px;
			border-color: #d7a97980;
			border-style: solid;
		}
		main::before { top: 18px; left: 18px; border-width: 1px 0 0 1px; border-radius: 16px 0 0; }
		main::after { right: 18px; bottom: 18px; border-width: 0 1px 1px 0; border-radius: 0 0 16px; }
		.eyebrow {
			margin: 0 0 20px;
			color: #d7a979;
			font-size: .72rem;
			font-weight: 600;
			letter-spacing: .38em;
			text-transform: uppercase;
		}
		h1 {
			margin: 0;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(3.2rem, 11vw, 7.8rem);
			font-weight: 400;
			letter-spacing: -.065em;
			line-height: .98;
			background: linear-gradient(110deg, #fff8eb 15%, #d7a979 52%, #fff8eb 88%);
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
			text-shadow: 0 10px 50px #d7a97924;
		}
		.rule { width: 52px; height: 1px; margin: 30px auto 0; background: #d7a979; box-shadow: 0 0 18px #d7a979; }
		@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
		@media (prefers-reduced-motion: reduce) { main { animation: none; } }
	</style>
</head>
<body>
	<main>
		<div>
			<p class="eyebrow">A name, a presence</p>
			<h1>Yash<br>Shinde</h1>
			<div class="rule" aria-hidden="true"></div>
		</div>
	</main>
</body>
</html>
